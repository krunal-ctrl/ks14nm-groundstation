---
layout: default
---
<div class="home">
  <section class="home-hero">
    <div class="hero-grid">
      <div class="hero-copy">
        {{ content }}
      </div>
      <div class="hero-badge">
        <img class="hero-badge-img" src="{{ '/assets/img/logo/ks14nm-badge.png' | relative_url }}" alt="KS14NM badge — a home-built TinyGS ground station emblem">
      </div>
    </div>
  </section>

  <section class="home-section">
    <div class="section-head">
      <span class="eyebrow">Live status</span>
      <h2>Telemetry</h2>
    </div>
    <!-- future: live stats, currently a static preview image -->
    <div id="telemetry">
      <img src="{{ '/assets/img/posts/telemetry-preview.png' | relative_url }}" alt="KS14NM live telemetry dashboard preview — signal strength, orbit track, and ground station status">
    </div>
  </section>

  <section class="home-section">
    <div class="section-head">
      <span class="eyebrow">Latest</span>
      <h2>Build Log &amp; Pass Reports</h2>
    </div>
    <div class="post-grid">
      {% for post in site.posts %}
        <a class="post-card" href="{{ post.url | relative_url }}">
          {% if post.cover_image %}<img src="{{ post.cover_image | relative_url }}" alt="{{ post.title }}">{% endif %}
          <div class="post-card-body">
            <span class="category-tag">{{ post.category }}</span>
            <h3>{{ post.title }}</h3>
            <p>{{ post.excerpt | strip_html | truncatewords: 20 }}</p>
          </div>
        </a>
      {% endfor %}
    </div>
  </section>
</div>
