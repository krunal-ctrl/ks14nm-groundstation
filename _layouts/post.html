---
layout: default
---
<a class="post-back" href="{{ '/' | relative_url }}">&larr; Back to Ground Station</a>

<article class="post-content">
  {% if page.cover_image %}
  <div class="post-hero-wrap">
    <img class="post-hero" src="{{ page.cover_image | relative_url }}" alt="{{ page.title }}">
  </div>
  {% endif %}

  <div class="post-body">
    <span class="category-tag">{{ page.category }}</span>
    <h1>{{ page.title }}</h1>
    {% include metadata-card.html %}
    {{ content }}
  </div>
</article>
